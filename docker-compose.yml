version: '3.8'

services:
  oracle-db:
    image: gvenzl/oracle-free:latest 
    container_name: odontologia_oracle
    environment:
      - ORACLE_PASSWORD=Admin123Password!
      - APP_USER=odontologia_user
      - APP_PASSWORD=Odontologia123!
    ports:
      - "1521:1521"
    volumes:
      - oracle_data:/opt/oracle/oradata
    networks:
      - odontologia_network

  backend-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: odontologia_api
    depends_on:
      - oracle-db
    ports:
      - "8080:8080"
    environment:
      - ConnectionStrings__DefaultConnection=Data Source=oracle-db:1521/FREEPDB1;User Id=odontologia_user;Password=Odontologia123!;
      - ASPNETCORE_ENVIRONMENT=Development
    networks:
      - odontologia_network

volumes:
  oracle_data:

networks:
  odontologia_network:
    driver: bridge