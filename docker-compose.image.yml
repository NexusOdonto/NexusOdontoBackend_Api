services:
  oracle-db:
    image: gvenzl/oracle-free:latest
    container_name: odontologia_oracle
    environment:
      - ORACLE_PASSWORD=${ORACLE_PASSWORD}
      - APP_USER=${ORACLE_APP_USER}
      - APP_USER_PASSWORD=${ORACLE_APP_PASSWORD}
    ports:
      - "${ORACLE_PORT}:1521"
    volumes:
      - oracle_data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    networks:
      - odontologia_network

  backend-api:
    image: nexusodonto/backend-api:latest
    container_name: odontologia_api
    depends_on:
      oracle-db:
        condition: service_healthy
    ports:
      - "${API_PORT}:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT}
      - ASPNETCORE_URLS=http://+:8080
      # El host es "oracle-db": el nombre del servicio en la red de Docker.
      # Dentro del contenedor "localhost" seria el propio contenedor.
      - ConnectionStrings__OracleConnection=User Id=${ORACLE_APP_USER};Password=${ORACLE_APP_PASSWORD};Data Source=oracle-db:1521/${ORACLE_PDB}
      - Jwt__Issuer=${JWT_ISSUER}
      - Jwt__Audience=${JWT_AUDIENCE}
      - Jwt__SigningKey=${JWT_SIGNING_KEY}
      - Jwt__ExpirationMinutes=${JWT_EXPIRATION_MINUTES}
      - Jwt__RefreshTokenExpirationDays=${JWT_REFRESH_TOKEN_EXPIRATION_DAYS:-7}
      - Google__ClientId=${Google__ClientId}
      - Google__ClientSecret=${Google__ClientSecret}
      - Auth__FrontendSuccessUrl=${Auth__FrontendSuccessUrl}
      - Auth__FrontendLinkUrl=${Auth__FrontendLinkUrl}
    networks:
      - odontologia_network

volumes:
  oracle_data:

networks:
  odontologia_network:
    driver: bridge
